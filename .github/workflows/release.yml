name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint checks
        run: npm run lint

      - name: Build Vite frontend
        run: npx vite build

      - name: Install Visual Studio Build Tools (better-sqlite3 native rebuild)
        # node-gyp needs a Visual Studio toolchain to rebuild better-sqlite3 for
        # the Electron ABI on the runner. The runner image's VS is not always
        # visible to node-gyp's vswhere detection, so install Build Tools with
        # the C++ workload explicitly (deterministic fix).
        shell: powershell
        run: |
          choco install visualstudio2022buildtools --yes --no-progress --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --passive --norestart"

      - name: Build & publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Run electron-builder directly (not via npm script) so --publish always
        # is passed to the builder, not to vite build.
        run: npx electron-builder --win --publish always
