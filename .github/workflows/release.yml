name: Build & Release

# Release path: CI BUILDS AND PUBLISHES on the tag push.
# scripts/publish-release.sh bumps the version, commits, tags, and pushes the
# branch + tag to origin — and then stops. It does not build and does not
# upload; this workflow does both. Pushing the tag is what starts a release.
#
# The tag must reach origin BEFORE anything is uploaded, so the release is
# attached to the exact commit being shipped rather than whatever the branch
# tip happens to be a minute later. That ordering is why the script pushes the
# tag first and lets this workflow take it from there.
#
# EARLIER DUPLICATE-RELEASE RACE (why the guard job below exists): when the
# script used to build locally with `electron-builder --publish always` AND
# this file fired on the same tag, both uploaded — duplicate releases and
# orphaned drafts, which broke auto-update. Local publishing was removed, so
# there is now exactly one uploader. The guard job is kept as belt-and-braces:
# it skips the build whenever a release for the current package.json version
# already exists, so a re-dispatch or an accidental extra tag can never clobber
# or duplicate a release.
#
# workflow_dispatch stays available for re-running a release by hand from
# another machine.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Guard: if a release for the version in package.json already exists, skip
  # the build entirely. Makes the workflow self-protecting against racing or
  # duplicating an existing release (re-dispatch, or a tag trigger being
  # re-added later).
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Skip only when the release is complete
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          TAG="v${VERSION}"
          # A release only counts as finished when the update feed an
          # installed app reads is published next to the installer. A
          # half-finished release (installer but no latest.yml) breaks
          # auto-update for every client — the updater 404s on the feed and
          # surfaces an error instead of updating. Those are rebuilt and
          # repaired, never skipped.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx 'latest\.yml'; then
            echo "⚠️  Release ${TAG} already exists and carries latest.yml — skipping build to avoid duplicating it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release ${TAG} is missing or has no latest.yml — rebuilding so the update feed is complete."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: guard
    if: needs.guard.outputs.skip == 'false'
    runs-on: windows-latest
    # GITHUB_TOKEN needs write access to contents to create the GitHub
    # Release and upload the installer assets via electron-builder.
    permissions:
      contents: write
    env:
      # Pin the Electron runtime + electron-builder binary caches to paths inside
      # the workspace. The defaults live under the runner's user profile, whose
      # exact location is not guaranteed; setting these explicitly means the
      # cache step below and the build always agree on one directory.
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Fetch all history + tags so the release-notes generator can
          # compute the previous tag and the commit log since it.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      # Caches below key off content hashes, so they invalidate automatically
      # when the lockfile or the Electron version changes — a stale cache can
      # never be reused for a different dependency set.

      - name: Resolve pnpm store path
        id: pnpm-store
        # Ask pnpm where its store actually lives rather than hardcoding a
        # Windows path that differs between runner images. shell: bash is
        # explicit because this job runs on windows-latest, where the default
        # run: shell is PowerShell and $(...) / >> would mean something else.
        shell: bash
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Cache Electron binaries
        uses: actions/cache@v6
        with:
          # Relative paths resolve against GITHUB_WORKSPACE, matching the
          # ELECTRON_CACHE / ELECTRON_BUILDER_CACHE env vars above.
          path: |
            .cache/electron
            .cache/electron-builder
          # Keyed on package.json because that is what pins the Electron
          # version electron-builder will download.
          key: ${{ runner.os }}-electron-${{ hashFiles('package.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint checks
        run: npm run lint

      - name: Build Vite frontend
        run: npx vite build

      - name: Install Visual Studio Build Tools (better-sqlite3 native rebuild)
        # node-gyp needs a Visual Studio toolchain to rebuild better-sqlite3 for
        # the Electron ABI on the runner. The runner image's VS is not always
        # visible to node-gyp's vswhere detection, so install Build Tools with
        # the C++ workload explicitly (deterministic fix).
        shell: powershell
        run: |
          choco install visualstudio2022buildtools --yes --no-progress --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --passive --norestart"

      - name: Setup Python 3.11 (node-gyp needs distutils)
        # The windows-latest runner defaults to Python 3.13, which REMOVED the
        # 'distutils' module from the stdlib. node-gyp imports distutils when
        # rebuilding better-sqlite3 for the Electron ABI, so every release run
        # previously died with 'ModuleNotFoundError: No module named distutils'.
        # Python 3.11 still ships distutils — pin it and hand node-gyp the exact
        # path via npm_config_python so it cannot fall back to 3.13.
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build & publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_python: ${{ steps.setup-python.outputs.python-path }}
          # Code signing — see CODE_SIGNING.md. Two supported paths:
          # 1) PFX cert via CSC_LINK/CSC_KEY_PASSWORD (electron-builder built-in)
          # 2) Azure Trusted Signing via azureSignOptions injected below from
          #    AZURE_SIGNING_* secrets. Both are optional: if neither is set,
          #    electron-builder skips signing (unsigned build, SmartScreen warns).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_CERT: ${{ secrets.AZURE_SIGNING_CERT }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        shell: bash
        # Run electron-builder directly (not via npm script) so --publish always
        # is passed to the builder, not to vite build. When the Azure Trusted
        # Signing endpoint secret is set, inject the azureSignOptions block via
        # CLI overrides so no credentials are committed to the repo. All four
        # Azure values are required together — fail fast rather than silently
        # producing a broken/unsigned build.
        run: |
          set -euo pipefail
          ARGS=(--win --publish always)
          if [ -n "${AZURE_SIGNING_ENDPOINT:-}" ]; then
            if [ -z "${AZURE_SIGNING_ACCOUNT:-}" ] || [ -z "${AZURE_SIGNING_PROFILE:-}" ] || [ -z "${AZURE_SIGNING_CERT:-}" ]; then
              echo "❌ AZURE_SIGNING_ENDPOINT is set but AZURE_SIGNING_ACCOUNT / AZURE_SIGNING_PROFILE / AZURE_SIGNING_CERT are missing."
              echo "   Add all four secrets (see CODE_SIGNING.md) or remove the endpoint secret."
              exit 1
            fi
            ARGS+=(
              "-c.win.azureSignOptions.endpoint=${AZURE_SIGNING_ENDPOINT}"
              "-c.win.azureSignOptions.trustedSigningAccountName=${AZURE_SIGNING_ACCOUNT}"
              "-c.win.azureSignOptions.certificateProfileName=${AZURE_SIGNING_PROFILE}"
              "-c.win.azureSignOptions.certificateName=${AZURE_SIGNING_CERT}"
            )
            echo "Code signing: Azure Trusted Signing configured."
          elif [ -n "${CSC_LINK:-}" ]; then
            echo "Code signing: PFX certificate configured via CSC_LINK."
          else
            echo "Code signing: none configured — building unsigned (SmartScreen will warn)."
          fi
          # Retry the publish. GitHub's release API intermittently fails
          # during asset uploads, and a failed upload leaves a
          # half-published release (installer without latest.yml) that breaks
          # auto-update for every installed app. Retrying is safe —
          # electron-builder replaces same-named assets — so a transient
          # failure becomes a normal release instead of a broken one.
          for attempt in 1 2 3; do
            echo "Publish attempt ${attempt}/3 ..."
            if npx electron-builder "${ARGS[@]}"; then
              echo "✓ Published on attempt ${attempt}."
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::electron-builder failed on all three attempts — the release is incomplete."
              exit 1
            fi
            echo "Publish failed — waiting 30s before retrying."
            sleep 30
          done

      - name: Verify the release carries a complete update feed
        # The release is only usable if the installer AND the update feed are
        # both on it. electron-builder uploads them as separate artifacts, so
        # a partial upload can leave the installer published while latest.yml
        # is missing — which is exactly what breaks the updater in installed
        # apps. Fail here, loudly, instead of shipping that.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -e "console.log(require('./package.json').version)")
          TAG="v${VERSION}"
          NAMES=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)
          echo "Assets on ${TAG}:"
          echo "$NAMES" | sed '/^$/d;s/^/  - /'
          MISSING=""
          for expected in "Manufacturing-ERP-Setup-${VERSION}.exe" "latest.yml"; do
            echo "$NAMES" | grep -qx "$expected" || MISSING="${MISSING} ${expected}"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Release ${TAG} is missing:${MISSING}"
            echo "::error::Installed apps read latest.yml from this release — without it they cannot update."
            exit 1
          fi
          echo "✓ Release ${TAG} carries the installer and its update feed."

      - name: Verify installer signature
        # verify-signature.cjs auto-discovers the newest 'Manufacturing ERP Setup *.exe'
        # in dist-electron, so this never breaks on a version bump. When signing is
        # configured, a non-Valid result fails the job; unsigned builds are informational.
        # Note: these env vars must be redeclared here — step env does not persist
        # between steps in GitHub Actions.
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
        shell: bash
        run: |
          set +e
          node scripts/verify-signature.cjs dist-electron
          code=$?
          if [ -n "${CSC_LINK:-}" ] || [ -n "${AZURE_SIGNING_ENDPOINT:-}" ]; then
            exit $code
          fi
          echo "Unsigned build by design — signature check informational."

      - name: Set professional release notes on the release
        # electron-builder may overwrite the release body with its own default
        # during --publish always; re-apply our generated changelog afterwards
        # so the release always carries the professional notes.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/set-release-notes.sh

      - name: Verify update feed is publicly reachable
        # Post-publish gate. A release is not done until an ANONYMOUS client
        # can read latest.yml and download the installer it describes — that
        # is exactly how electron-updater asks for updates. This check exists
        # because GitHub served 504s for latest.yml while the release page and
        # CI were green, silently blocking every installed app from updating.
        #
        # No token is used here on purpose: an authenticated request would not
        # reproduce what the app actually does.
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -e "console.log(require('./package.json').version)")
          TAG="v${VERSION}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          MANIFEST_URL="${BASE}/latest.yml"
          LATEST_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest"

          echo "Verifying anonymous update feed for ${TAG} ..."

          # Step 1: the updater discovers the newest version from this redirect.
          RESOLVED=""
          for attempt in $(seq 1 18); do
            RESOLVED=$(curl -sS -o /dev/null -w "%{url_effective}" -L --max-time 30 "${LATEST_URL}" || true)
            case "${RESOLVED}" in
              *"/tag/${TAG}")
                echo "  ✓ releases/latest -> ${TAG} (attempt ${attempt})"
                break
                ;;
            esac
            echo "  attempt ${attempt}/18: releases/latest -> ${RESOLVED:-<no response>}; retrying in 10s"
            sleep 10
          done
          case "${RESOLVED}" in
            *"/tag/${TAG}")
              ;;
            *)
              echo "::error::releases/latest does not resolve to ${TAG} (got: ${RESOLVED:-<no response>})"
              echo "::error::Installed apps resolve the latest version from this URL, so none of them can see this release."
              exit 1
              ;;
          esac

          # Step 2: latest.yml must be readable anonymously. GitHub has served
          # 504s here during incidents while the release page itself stayed up.
          HTTP_CODE=""
          for attempt in $(seq 1 18); do
            HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" -L --max-time 30 "${MANIFEST_URL}" || true)
            if [ "${HTTP_CODE}" = "200" ]; then
              echo "  ✓ latest.yml -> HTTP 200 (attempt ${attempt})"
              break
            fi
            echo "  attempt ${attempt}/18: latest.yml -> HTTP ${HTTP_CODE:-<no response>}; retrying in 10s"
            sleep 10
          done
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::latest.yml is NOT publicly reachable (HTTP ${HTTP_CODE:-<no response>}): ${MANIFEST_URL}"
            echo "::error::Installed apps cannot auto-update from this release. Do NOT announce it as shipped."
            exit 1
          fi
          curl -sS -L --max-time 30 -o latest.yml.check "${MANIFEST_URL}"

          # Step 3: the manifest must describe this exact version and asset.
          EXPECTED_VERSION="${VERSION}" node -e '
            const fs = require("fs");
            const yml = fs.readFileSync("latest.yml.check", "utf8");
            const version = /^version:\s*(\S+)/m.exec(yml)?.[1];
            const url = /^\s*-\s*url:\s*(\S+)/m.exec(yml)?.[1];
            const size = Number(/^\s*size:\s*(\d+)/m.exec(yml)?.[1]);
            const sha512 = /^sha512:\s*(\S+)/m.exec(yml)?.[1];
            if (!version) { console.error("::error::latest.yml has no version field"); process.exit(1); }
            if (version !== process.env.EXPECTED_VERSION) {
              console.error(`::error::latest.yml version ${version} does not match package.json ${process.env.EXPECTED_VERSION}`);
              process.exit(1);
            }
            if (!url) { console.error("::error::latest.yml has no file url"); process.exit(1); }
            if (!Number.isFinite(size) || size <= 0) { console.error("::error::latest.yml has no valid size"); process.exit(1); }
            if (!sha512) { console.error("::error::latest.yml has no sha512"); process.exit(1); }
            fs.writeFileSync("latest.yml.target", url);
            console.log(`  ✓ manifest: version=${version} file=${url} size=${size}`);
          '

          # Step 4: the installer itself must download and match the manifest.
          # A partial or corrupted upload would otherwise pass a manifest-only
          # check and fail on every user's machine.
          TARGET=$(cat latest.yml.target)
          FILE_URL="${BASE}/${TARGET}"
          echo "  downloading installer anonymously: ${FILE_URL}"
          if ! curl -sS --fail -L --max-time 900 -o installer.check "${FILE_URL}"; then
            echo "::error::installer referenced by latest.yml is NOT downloadable: ${FILE_URL}"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const yml = fs.readFileSync("latest.yml.check", "utf8");
            const expectedSize = Number(/^\s*size:\s*(\d+)/m.exec(yml)?.[1]);
            const expectedSha = /^sha512:\s*(\S+)/m.exec(yml)?.[1];
            const bytes = fs.readFileSync("installer.check");
            const actualSha = crypto.createHash("sha512").update(bytes).digest("base64");
            if (bytes.length !== expectedSize) {
              console.error(`::error::installer size ${bytes.length} does not match latest.yml size ${expectedSize}`);
              process.exit(1);
            }
            if (actualSha !== expectedSha) {
              console.error("::error::installer sha512 does not match latest.yml");
              process.exit(1);
            }
            console.log(`  ✓ installer verified: ${bytes.length} bytes, sha512 matches latest.yml`);
          '
          rm -f latest.yml.check latest.yml.target installer.check
          echo "✓ Anonymous auto-update path verified for ${TAG}."
