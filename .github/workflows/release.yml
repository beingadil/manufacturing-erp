name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: windows-latest
    # GITHUB_TOKEN needs write access to contents to create the GitHub
    # Release and upload the installer assets via electron-builder.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch all history + tags so the release-notes generator can
          # compute the previous tag and the commit log since it.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint checks
        run: npm run lint

      - name: Build Vite frontend
        run: npx vite build

      - name: Install Visual Studio Build Tools (better-sqlite3 native rebuild)
        # node-gyp needs a Visual Studio toolchain to rebuild better-sqlite3 for
        # the Electron ABI on the runner. The runner image's VS is not always
        # visible to node-gyp's vswhere detection, so install Build Tools with
        # the C++ workload explicitly (deterministic fix).
        shell: powershell
        run: |
          choco install visualstudio2022buildtools --yes --no-progress --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --passive --norestart"

      - name: Setup Python 3.11 (node-gyp needs distutils)
        # The windows-latest runner defaults to Python 3.13, which REMOVED the
        # 'distutils' module from the stdlib. node-gyp imports distutils when
        # rebuilding better-sqlite3 for the Electron ABI, so every release run
        # previously died with 'ModuleNotFoundError: No module named distutils'.
        # Python 3.11 still ships distutils — pin it and hand node-gyp the exact
        # path via npm_config_python so it cannot fall back to 3.13.
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build & publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_python: ${{ steps.setup-python.outputs.python-path }}
        # Run electron-builder directly (not via npm script) so --publish always
        # is passed to the builder, not to vite build.
        run: npx electron-builder --win --publish always

      - name: Set professional release notes on the release
        # electron-builder may overwrite the release body with its own default
        # during --publish always; re-apply our generated changelog afterwards
        # so the release always carries the professional notes.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/set-release-notes.sh
