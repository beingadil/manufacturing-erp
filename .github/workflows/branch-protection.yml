name: Branch Protection

# Applies/refreshes the branch protection rule on master that makes the CI gate
# binding.
#
# WHY A WORKFLOW FOR THIS: branch protection is repository configuration, not
# code, so it is invisible in the git history and silently drifts — someone
# toggles a setting in the UI, or a repo transfer resets it. Re-applying it on a
# schedule makes the desired state declarative and idempotent instead of a
# one-time click somebody has to remember.
#
# TWO CONSTRAINTS THAT SHAPE THIS FILE:
#
# 1. NO "REQUIRE PULL REQUEST" RULE. publish-release.sh pushes the release
#    branch and its tag DIRECTLY to master. Enabling required_pull_request_reviews
#    would make every release fail to push. required_pull_request_reviews and
#    restrictions are therefore both null on purpose.
# 2. THE TOKEN. The branch-protection API needs "Administration: Read and write".
#    GITHUB_TOKEN can never have that, and `permissions:` below cannot grant it:
#    administration is a repository-ROLE permission, not a token scope, so
#    requesting it here makes the whole workflow file invalid and GitHub refuses
#    to load it at all (the job never starts, and the workflow shows up under
#    its file path instead of its name). To actually apply the rule, store a
#    fine-grained PAT (Administration -> Read and write) as the repo secret
#    BRANCH_PROTECTION_TOKEN; the apply step passes it to github-script.
#    Without that secret it falls back to GITHUB_TOKEN, warns, and exits 0 --
#    a weekly cron that cannot succeed should not go red every Monday.

on:
  workflow_dispatch:
    inputs:
      context:
        description: 'Required status check (the job name in ci.yml)'
        required: false
        default: 'lint-and-test'
      enforce_admins:
        description: 'Apply the rule to admins too'
        type: boolean
        required: false
        default: false
  schedule:
    # Weekly drift repair. 03:17 UTC avoids the top-of-hour Actions rush.
    - cron: '17 3 * * 1'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      # Valid token scopes ONLY. "administration" is NOT one of them -- it is a
      # repository-role permission. Listing it here invalidates the entire
      # workflow file and GitHub silently refuses to run it. See header note 2.
      contents: read
      # Read-only, for the diagnostics step below (check-suites on a private
      # repo are not visible under contents alone).
      checks: read
    steps:
      # Show what check contexts actually exist on the newest commit, so if the
      # required context is ever misspelled you can see the correct name here
      # instead of guessing.
      #
      # DIAGNOSTIC ONLY -- it must never be able to fail the run and thereby
      # skip the apply step below. It silently did for its whole life: while the
      # file was unloadable nobody could see it, and the moment GitHub could run
      # it the step threw (the endpoint is not reachable at rest.repos.* or
      # rest.checkSuites.* in the bundled octokit) and took the job down with it.
      #
      # Uses the raw route rather than a rest.* helper so it cannot break again
      # on an octokit namespace/version difference inside actions/github-script.
      - name: Show recent status check contexts
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            try {
              const { data } = await github.request('GET /repos/{owner}/{repo}/commits/{ref}/check-runs', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'master',
                per_page: 100,
              });
              const names = [...new Set((data.check_runs || []).map(r => r.name))];
              core.info('Check contexts seen on master: ' + (names.join(', ') || '(none yet)'));
            } catch (error) {
              core.warning(`Could not list check contexts (${error.status}): ${error.message}`);
            }

      - name: Apply branch protection to master
        uses: actions/github-script@v9
        with:
          # Without this line the PAT secret is never used: github-script always
          # authenticated with the default GITHUB_TOKEN, so the "add a secret"
          # advice in the 403 handler changed nothing and the rule could never be
          # applied. Falls back to GITHUB_TOKEN when the secret is absent.
          github-token: ${{ secrets.BRANCH_PROTECTION_TOKEN || github.token }}
          script: |
            const context_name = '${{ inputs.context }}' || 'lint-and-test';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const has_pat = Boolean('${{ secrets.BRANCH_PROTECTION_TOKEN }}');

            if (!has_pat) {
              core.warning(
                'BRANCH_PROTECTION_TOKEN is not set, so branch protection was NOT applied. ' +
                'GITHUB_TOKEN can never hold Administration: write, and it cannot be granted ' +
                'via `permissions:` (administration is a repository-role permission, not a ' +
                'token scope). To turn this on: create a fine-grained PAT with ' +
                'Administration -> Read and write on this repository, add it as the repo ' +
                'secret BRANCH_PROTECTION_TOKEN, then re-run this workflow. Exiting 0 so the ' +
                'weekly cron stays green while it is deliberately unconfigured.'
              );
              return;
            }

            // Read the current rule first so a healthy repo is a no-op rather than
            // a blind overwrite on every Monday.
            let current = null;
            try {
              const { data } = await github.rest.repos.getBranchProtection({
                owner, repo, branch: 'master',
              });
              current = data;
            } catch (error) {
              if (error.status !== 404) {
                core.setFailed(`Could not read branch protection (${error.status}): ${error.message}`);
                return;
              }
            }

            const correct =
              current &&
              current.required_status_checks &&
              current.required_status_checks.strict === true &&
              (current.required_status_checks.contexts || []).includes(context_name) &&
              Boolean(current.allow_force_pushes && current.allow_force_pushes.enabled) === false &&
              Boolean(current.allow_deletions && current.allow_deletions.enabled) === false &&
              !current.required_pull_request_reviews &&
              !current.restrictions;

            if (correct) {
              core.info(`Branch protection already correct on master (required check: ${context_name}) - nothing to do.`);
              return;
            }

            try {
              await github.rest.repos.updateBranchProtection({
                owner,
                repo,
                branch: 'master',
                required_status_checks: {
                  strict: true,
                  contexts: [context_name],
                },
                // Deliberately null — see constraint 1 in the header.
                enforce_admins: ${{ inputs.enforce_admins || false }},
                required_pull_request_reviews: null,
                restrictions: null,
                allow_force_pushes: false,
                allow_deletions: false,
              });
              core.info(`Branch protection applied to master (required check: ${context_name})`);
            } catch (error) {
              if (error.status === 403) {
                core.setFailed(
                  'GitHub refused the request (403). BRANCH_PROTECTION_TOKEN is set but was not ' +
                  'accepted for branch protection. Confirm it is a fine-grained PAT with ' +
                  'Administration -> Read and write on this repository, and that it has not expired.'
                );
                return;
              }
              core.setFailed(`Branch protection failed (${error.status}): ${error.message}`);
              return;
            }

            const { data } = await github.rest.repos.getBranchProtection({
              owner, repo, branch: 'master',
            });
            core.info('Verified: required checks = ' + JSON.stringify(data.required_status_checks));
